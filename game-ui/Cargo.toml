[package]
name = "game-ui"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
minesweeper-lib = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
codee = { workspace = true }
cfg-if = { workspace = true }
leptos = { workspace = true }
leptos-use = { workspace = true, features = ["storage", "use_document", "use_event_listener", "use_color_mode"] }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["WebSocket", "Performance"] }
plotters = { workspace = true }
plotters-canvas = { workspace = true }
