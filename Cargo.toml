[workspace]
resolver = "2"
members = [
  # core
  "web",

  # integrations
  "tauri",
  "tauri/src-tauri",

  # libraries
  "minesweeper-lib",
  "game-manager",
  "game-ui",
  "web-auth",
]
exclude = ["minesweeper-lib/example"]

[workspace.package]
version = "0.1.0"

[workspace.dependencies]
# Path dependencies
minesweeper-lib = { path = "./minesweeper-lib", version = "0.1.0" }
minesweeper-web = { path = "./web", version = "0.1.0" }
game-manager = { path = "./game-manager" }
game-ui = { path = "./game-ui" }
web-auth = { path = "./web-auth" }

# External dependencies
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws", "macros"] }
axum-login = "0.17"
cfg-if = "1.0"
chrono = { version = "0.4", features = ["serde"] }
codee = { version = "0.3", features = ["json_serde_wasm"] }
console_error_panic_hook = "0.1"
console_log = "1.0"
futures = "0.3"
getrandom = { version = "0.3", features = ["wasm_js"] }
http = "1.1"
leptos = { version = "0.8.0", features = ["nightly"] }
leptos-use = "0.16.0"
log = "0.4"
oauth2 = "5.0"
plotters = "0.3.7"
plotters-canvas = "0.3.0"
reqwest = { version = "0.12", features = ["json"] }
serde = "1.0"
serde_json = "1.0"
sqlx = "0.8"
thiserror = "2.0"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tower-sessions = "0.14"
tracing = "0.1"
wasm-bindgen = "=0.2.117"
web-sys = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 'z'

# Defines a size-optimized profile for the WASM bundle in release mode
[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"
